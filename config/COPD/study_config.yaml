    - id: "GSE38974"
      platform: "GPL570"
      batch: 12
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE38974_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE38974_series_matrix.txt"

    - id: "GSE47460"
      platform: "GPL14550"
      batch: 13
      log2_transform: true
      metadata_file: "data/COPD/raw/host/GSE47460_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE47460_series_matrix.txt"

    - id: "GSE56341"
      platform: "GPL570"
      batch: 14
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE56341_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE56341_series_matrix.txt"

    - id: "GSE57148"
      platform: "GPL10558"      # Illumina HumanHT-12 v4
      batch: 15
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE57148_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE57148_series_matrix.txt"

    - id: "GSE73395"
      platform: "GPL570"
      batch: 16
