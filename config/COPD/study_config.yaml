# ================================================================
# 研究配置文件 — COPD 多组学荟萃分析
# 论文：Wang et al. "Multi-omic meta-analysis identifies functional
#       signatures of airway microbiome in COPD"
# ================================================================

study:
  name: "COPD"
  description: "Multi-omic meta-analysis of airway microbiome in COPD"
  disease_label: "COPD"     # 需与各数据集 metadata 中的表型列值完全匹配
  control_label: "Control"

# ----------------------------------------------------------------
# 宿主组学配置
# 换组学类型：将 type 改为 rnaseq / proteomics / methylation
# 并在 datasets 中补充对应格式的字段（详见其他 study_config 示例）
# ----------------------------------------------------------------
host_omics:
  type: "microarray"

  datasets:
    - id: "GSE103174"
      platform: "GPL570"        # ⚠️ 请核实后填写正确平台号
      batch: 1
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE103174_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE103174_series_matrix.txt"

    - id: "GSE106986"
      platform: "GPL570"
      batch: 2
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE106986_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE106986_series_matrix.txt"

    - id: "GSE112260"
      platform: "GPL570"
      batch: 3
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE112260_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE112260_series_matrix.txt"

    - id: "GSE11784"
      platform: "GPL96"
      batch: 4
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE11784_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE11784_series_matrix.txt"

    - id: "GSE119040"
      platform: "GPL570"
      batch: 5
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE119040_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE119040_series_matrix.txt"

    - id: "GSE11906"
      platform: "GPL96"
      batch: 6
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE11906_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE11906_series_matrix.txt"

    - id: "GSE12472"
      platform: "GPL96"
      batch: 7
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE12472_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE12472_series_matrix.txt"

    - id: "GSE13896"
      platform: "GPL570"
      batch: 8
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE13896_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE13896_series_matrix.txt"

    - id: "GSE16972"
      platform: "GPL96"
      batch: 9
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE16972_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE16972_series_matrix.txt"

    - id: "GSE37147"
      platform: "GPL14550"      # Agilent 4×44K
      batch: 10
      log2_transform: true      # Agilent 数据通常需要 log2 变换
      metadata_file: "data/COPD/raw/host/GSE37147_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE37147_series_matrix.txt"

    - id: "GSE37768"
      platform: "GPL6244"       # Affymetrix HuGene-1_0-st
      batch: 11
