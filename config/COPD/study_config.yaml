      metadata_file: "data/COPD/raw/host/GSE8581_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE8581_series_matrix.txt"

    - id: "GSE86064"
      platform: "GPL570"
      batch: 19
      log2_transform: false
      metadata_file: "data/COPD/raw/host/GSE86064_metadata.txt"
      matrix_file:   "data/COPD/raw/host/GSE86064_series_matrix.txt"

  # 荟萃分析参数
  metaanalysis:
    method: "REM"            # REM（随机效应）或 FEM（固定效应）
    individual_method: "modt"  # 单研究统计方法：modt | t | Wilcoxon
    nperm: 300
    batch_correction: true
    imputation:
      method: "knn"          # knn | none
      k: 10

# ----------------------------------------------------------------
# 微生物/环境侧组学配置
# 换组学类型：将 type 改为 metatranscriptomics / metabolomics
# ----------------------------------------------------------------
meta_omics:
  type: "metagenomics"

  datasets:
    - id: "SRP066375"
      batch: 1
      taxonomy_file: "data/COPD/raw/meta/SRP066375.taxonomy.tsv"
      feature_file:  "data/COPD/raw/meta/SRP066375.tsv"   # PICRUSt2 EC 贡献表

    - id: "SRP136124"
      batch: 2
      taxonomy_file: "data/COPD/raw/meta/SRP136124.taxonomy.tsv"
      feature_file:  "data/COPD/raw/meta/SRP136124.tsv"

  metaanalysis:
    method: "REM"
    individual_method: "modt"
    nperm: 300
    batch_correction: false  # 宏基因组通常不需要 ComBat

# ----------------------------------------------------------------
# 桥接数据库配置
# 换桥接类型：将 type 改为 direct_metabolomics
# ----------------------------------------------------------------
bridge:
  type: "metacyc_stitch"

  metacyc_stitch:
    stitch_confidence_threshold: 700   # STITCH 互作置信度阈值（0-1000）
    host_species_id: "9606"            # 人类 NCBI Taxonomy ID
    # 宿主源化合物黑名单（这些化合物由宿主产生，不计入微生物贡献）
    human_compound_filter: "data/COPD/raw/bridge/human_cmpd_list.txt"

  # 仅当 type: direct_metabolomics 时生效
  direct_metabolomics:
    compound_gene_database: "data/COPD/raw/bridge/hmdb_gene_interactions.tsv"

# ----------------------------------------------------------------
# EPCS（原 PRMT）整合计算配置
# ----------------------------------------------------------------
integration:
  emm_source: "metacyc_stitch"    # 或 direct
  effect_size_source: "meta_omics"

# ----------------------------------------------------------------
# 敏感性分析配置
# ----------------------------------------------------------------
sensitivity:
  logo_analysis:
    enabled: true
    genus_list_file: "data/COPD/raw/sensitivity/genus_list.txt"
    ec_list_file:    "data/COPD/raw/sensitivity/ec_list.txt"
    datasets: ["SRP066375", "SRP136124"]

# ----------------------------------------------------------------
# 输出目录
# ----------------------------------------------------------------
output:
  base_dir: "results/COPD"
  save_intermediate: true
